
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Appointment Details</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Doctor Header -->
<div th:replace="doctor-layout :: header"></div>


<div class="main-wrapper">

    <!-- Doctor Sidebar -->
    <div th:replace="doctor-layout :: sidebar"></div>


    <!-- Main Content -->
    <main class="workspace">

        <div class="page-title-section">

            <h1>Appointment Details</h1>

            <p class="page-subtitle">
                View complete information about this appointment
            </p>

        </div>


        <div class="appointment-board">

            <div class="appointment-list">

                <div class="appointment-card-large">

                    <!-- Doctor Information -->
                    <div class="appointment-top">

                        <div class="doctor-avatar"
                             th:text="${#strings.substring(appointment.doctor.fullName, 0, 1)}">
                            D
                        </div>

                        <div class="doctor-details">

                            <h3 th:text="${appointment.doctor.fullName}">
                                Doctor Name
                            </h3>

                            <span th:text="${appointment.doctor.specialty}">
                                    Specialty
                                </span>

                        </div>

                    </div>


                    <!-- Appointment Information -->
                    <div class="appointment-middle">

                        <div class="appointment-item">

                            <label>Appointment ID</label>

                            <span th:text="${appointment.id}">
                                    56
                                </span>

                        </div>


                        <div class="appointment-item">

                            <label>Patient Name</label>

                            <span th:text="${appointment.patientName}">
                                    Patient Name
                                </span>

                        </div>


                        <div class="appointment-item">

                            <label>Phone Number</label>

                            <span th:text="${appointment.phoneNumber}">
                                    Phone Number
                                </span>

                        </div>


                        <div class="appointment-item">

                            <label>Appointment Date</label>

                            <span th:text="${appointment.appointmentDate}">
                                    Date
                                </span>

                        </div>


                        <div class="appointment-item">

                            <label>Appointment Time</label>

                            <span th:text="${appointment.appointmentTime}">
                                    Time
                                </span>

                        </div>


                        <div class="appointment-item">

                            <label>Status</label>

                            <span class="status-badge"
                                  th:text="${appointment.status}">
                                    BOOKED
                                </span>

                        </div>

                    </div>


                    <!-- Reason -->
                    <div class="appointment-item">

                        <label>Reason for Appointment</label>

                        <span th:text="${appointment.reason}">
                                Reason
                            </span>

                    </div>


                    <!-- Actions -->
                    <div class="appointment-bottom">

                        <a th:href="@{/doctor/appointment/complete/{id}(id=${appointment.id})}"
                           class="ui-btn ui-btn-red"
                           th:if="${appointment.status.name() != 'COMPLETED'}">
                            Complete Appointment
                        </a>

                        <a th:href="@{/doctor/appointments}"
                           class="ui-btn ui-btn-outline">
                            Back to Appointments
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
