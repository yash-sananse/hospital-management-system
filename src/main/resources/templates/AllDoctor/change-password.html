<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="doctor-layout :: header"></div>

<div class="main-wrapper">

    <div th:replace="doctor-layout :: sidebar"></div>

    <!-- Workspace area styled with Crimson Medical Palette -->
    <div class="workspace">

        <!-- Page title section -->
        <div class="page-title-section">
            <h1>Change Password</h1>
        </div>

        <!-- Centered card for form -->
        <div class="centered-card">
            <div class="content-board">

                <form th:action="@{/doctor/send-otp}" method="post" class="form-max-container">

                    <!-- Email field -->
                    <div class="input-block">
                        <label for="email">Registered Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="field-element"
                            placeholder="Enter your registered email"
                            required>
                    </div>

                    <!-- Submit button -->
                    <div class="input-block">
                        <button type="submit" class="submit-btn">
                            Send OTP
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>

</div>

</body>
</html>
