<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Schedule</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header -->
<div th:replace="doctor-layout :: header"></div>

<div class="main-wrapper">

    <!-- Sidebar -->
    <div th:replace="doctor-layout :: sidebar"></div>

    <!-- Main Content -->
    <main class="workspace">

        <div class="page-title-section">
            <h1>Today's Schedule</h1>
        </div>

        <!-- Statistics -->
        <div class="mini-stats-grid u-mb-24px">

            <div class="stat-counter-box">
                <div class="stat-icon">📅</div>
                <div class="stat-label">Total Appointments</div>
                <div class="stat-value"
                     th:text="${totalAppointments}">
                    0
                </div>
            </div>

            <div class="stat-counter-box">
                <div class="stat-icon">✅</div>
                <div class="stat-label">Completed</div>
                <div class="stat-value"
                     th:text="${completedCount}">
                    0
                </div>
            </div>

            <div class="stat-counter-box">
                <div class="stat-icon">⏳</div>
                <div class="stat-label">Pending</div>
                <div class="stat-value"
                     th:text="${pendingCount}">
                    0
                </div>
            </div>

        </div>

        <!-- Schedule Table -->
        <div class="content-board">

            <div class="board-header">
                <h2 class="board-title">Today's Appointments</h2>
            </div>

            <div class="table-wrapper">

                <table class="medical-table">

                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Time</th>
                        <th>Patient Name</th>
                        <th>Age</th>
                        <th>Reason</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- No Records -->
                    <tr th:if="${#lists.isEmpty(todayAppointments)}">
                        <td colspan="6" class="u-ta-center">
                            No appointments scheduled for today.
                        </td>
                    </tr>

                    <!-- Dynamic Records -->
                    <tr th:each="appointment, stat : ${todayAppointments}">
                        <td th:text="${stat.count}"></td>

                        <td th:text="${appointment.appointmentTime}">
                            10:00 AM
                        </td>

                        <td th:text="${appointment.patientName}">
                            Patient Name
                        </td>

                        <td th:text="${appointment.phoneNumber}">
                            25
                        </td>

                        <td th:text="${appointment.reason}">
                            Fever
                        </td>

                        <td>
                            <span class="role-badge"
                                  th:text="${appointment.status}">
                                Scheduled
                            </span>
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>
</html>
