
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Patient Header -->
<div th:replace="Patient-layout :: header"></div>

<!-- Patient Sidebar -->
<div th:replace="Patient-layout :: sidebar"></div>


<!-- Main Wrapper -->
<div class="main-wrapper">

    <main class="workspace">

        <!-- Page Title -->
        <div class="page-title-section">

            <h1>Change Password</h1>

            <p class="page-subtitle">
                Change your password securely using OTP verification.
            </p>

        </div>


        <!-- Content Board -->
        <div class="content-board">

            <div class="board-header">

                <div class="board-title">
                    Change Password
                </div>

            </div>


            <!-- Success Message -->
            <div th:if="${success}"
                
                 th:text="${success}" class="u-bg-dcfce7 u-color-166534 u-p-12px u-br-6px u-mb-20px">
            </div>


            <!-- Error Message -->
            <div th:if="${error}"
                
                 th:text="${error}" class="u-bg-fee2e2 u-color-991b1b u-p-12px u-br-6px u-mb-20px">
            </div>


            <div class="form-max-container">


                <!-- =============================== -->
                <!-- STEP 1 : SEND OTP -->
                <!-- =============================== -->

                <div>

                    <h3 class="u-mb-8px">
                        Step 1: Send OTP
                    </h3>

                    <p class="page-subtitle u-mb-20px"
                      >

                        Click the button below to receive
                        an OTP on your registered email.

                    </p>


                    <!-- GET REQUEST -->
                    <form th:action="@{/user/send-change-password-otp}"
                          method="get">

                        <button type="submit"
                                class="ui-btn ui-btn-red">

                            Send OTP to Email

                        </button>

                    </form>

                </div>


                <!-- =============================== -->
                <!-- STEP 2 : OTP + PASSWORD -->
                <!-- =============================== -->

                <div th:if="${otpSent}"
                     class="u-mt-30px">

                    <h3 class="u-mb-8px">
                        Step 2: Verify OTP & Change Password
                    </h3>

                    <p class="page-subtitle u-mb-20px"
                      >

                        Enter the OTP sent to your email
                        and create your new password.

                    </p>


                    <!-- POST REQUEST -->
                    <form th:action="@{/user/change-password}"
                          method="post">


                        <!-- OTP -->

                        <div class="input-block">

                            <label for="otp">
                                Email OTP
                            </label>

                            <input type="text"
                                   id="otp"
                                   name="otp"
                                   class="field-element"
                                   placeholder="Enter 6-digit OTP"
                                   maxlength="6"
                                   required>

                        </div>


                        <!-- New Password -->

                        <div class="input-block">

                            <label for="newPassword">
                                New Password
                            </label>

                            <input type="password"
                                   id="newPassword"
                                   name="newPassword"
                                   class="field-element"
                                   placeholder="Enter your new password"
                                   required>

                        </div>


                        <!-- Confirm Password -->

                        <div class="input-block">

                            <label for="confirmPassword">
                                Confirm New Password
                            </label>

                            <input type="password"
                                   id="confirmPassword"
                                   name="confirmPassword"
                                   class="field-element"
                                   placeholder="Confirm your new password"
                                   required>

                        </div>


                        <!-- Change Password Button -->

                        <div class="u-d-flex u-gap-12px u-mt-20px">

                            <button type="submit"
                                    class="ui-btn ui-btn-red">

                                Change Password

                            </button>

                        </div>

                    </form>

                </div>


                <!-- =============================== -->
                <!-- BACK TO DASHBOARD -->
                <!-- =============================== -->

                <div class="u-mt-30px">

                    <a th:href="@{/user/dashboard}"
                       class="ui-btn ui-btn-outline">

                        ← Back to Dashboard

                    </a>

                </div>


            </div>

        </div>

    </main>

</div>

</body>
</html>
