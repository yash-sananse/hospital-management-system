<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Doctor - Admin Console</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- Header Fragment -->
<div th:replace="layout :: header"></div>

<div class="main-wrapper">

    <!-- Sidebar Fragment -->
    <div th:replace="layout :: sidebar"></div>

    <!-- Workspace -->
    <main class="workspace centered-page">
        <section class="centered-card content-board form-max-container">

            <div class="board-header">
                <div class="board-title">Edit Doctor</div>
                <div>
                    <a th:href="@{/admin/users}" class="ui-btn ui-btn-outline">
                        ← Back to Users
                    </a>
                </div>
            </div>

            <form th:action="@{/admin/updatedoctor}"
                  th:object="${doctor}"
                  method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="input-block">
                    <label>Full Name</label>
                    <input class="field-element"
                           type="text"
                           th:field="*{fullName}"
                           required />
                </div>

                <div class="input-block">
                    <label>Email Address</label>
                    <input class="field-element"
                           type="email"
                           th:field="*{email}"
                           required />
                </div>

                <div class="input-block">
                    <label>Username</label>
                    <input class="field-element"
                           type="text"
                           th:field="*{username}"
                           required />
                </div>

                <div class="input-block">
                    <label>Phone Number</label>
                    <input class="field-element"
                           type="text"
                           th:field="*{phoneNumber}" />
                </div>

                <div class="input-block">
                    <label>Specialty</label>
                    <input class="field-element"
                           type="text"
                           th:field="*{specialty}" />
                </div>

                <div class="input-block">
                    <label>Clinic</label>
                    <input class="field-element"
                           type="text"
                           th:field="*{clinic}" />
                </div>

                <div class="input-block">
                    <label>Consultation Fee (₹)</label>
                    <input class="field-element"
                           type="number"
                           step="0.01"
                           min="0"
                           th:field="*{consultationFee}" />
                </div>

                <div class="input-block">
                    <label>Status</label>

                    <select class="field-element"
                            th:field="*{active}">
                        <option th:value="true">Active</option>
                        <option th:value="false">Inactive</option>
                    </select>
                </div>

                <button type="submit"
                        class="ui-btn ui-btn-red u-w-100pct u-mt-12px"
                       >
                    Update Doctor
                </button>

            </form>

        </section>
    </main>

</div>

</body>
</html>
