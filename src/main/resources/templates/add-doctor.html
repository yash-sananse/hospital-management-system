<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>➕👨‍⚕️ Add Doctor</title>

    <link rel="stylesheet" href="/css/style.css" />

    
</head>

<body class="page-add-doctor">

    <!-- Header -->
    <div th:replace="layout :: header"></div>

    <div class="main-wrapper">

        <!-- Sidebar -->
        <div th:replace="layout :: sidebar"></div>

        <!-- Main Workspace -->
        <main class="workspace">

            <!-- Page Title -->
            <section class="page-title-section">
                <h1>➕👨‍⚕️ Add Doctor</h1>
            </section>

            <!-- Add Doctor Form -->
            <section class="content-board">

                <div class="board-header">
                    <div class="board-title">📝 Doctor Information</div>
                </div>

                <form th:action="@{/admin/save-doctor}" th:object="${doctor}" method="post">

                    <!-- Name Field -->
                    <div class="form-group">
                        <label><span class="emoji-label">👤</span> Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-input"
                               placeholder="Enter Doctor Name" required />
                    </div>
					                   
					                   
					                   
					                    <!-- Username Field -->
					<div class="form-group">
					    <label><span class="emoji-label">👨‍⚕️</span> Username</label>
					    <input type="text"
					           th:field="*{username}"
					           class="form-input"
					           placeholder="Enter Username"
					           required />
					</div>
					<!-- Email -->
					<div class="form-group">
					    <label>
					        <span class="emoji-label">📧</span>
					        Email
					    </label>
					
					    <input type="email"
					           th:field="*{email}"
					           class="form-input"
					           placeholder="Enter Email"
					           required />
					</div>

                    <!-- Consultation Fee  block  -->
                    <div class="form-group">

                        <label>Consultation Fee (₹)</label>

                        <input
                                type="number"
                                step="0.01"
                                min="0"
                                class="form-input"
                                th:field="*{consultationFee}"
                                placeholder="Enter consultation fee">

                    </div>
					
					<!-- Password Field -->
					<div class="form-group">
					    <label><span class="emoji-label">🔒</span> Password</label>
					    <input type="password"
					           th:field="*{password}"
					           class="form-input"
					           placeholder="Enter Password"
					           required />
					</div>
                    

                    <!-- Searchable Dropdown Specialty Field -->
                    <div class="form-group">
                        <label><span class="emoji-label">💉</span> Specialty</label>
                        <input type="text" th:field="*{specialty}" class="form-input" 
                               list="specialty-options" placeholder="Search or type specialty..." required />
                        
                        <!-- Auto-Filtering Dropdown Menu List -->
                        <datalist id="specialty-options">
                            <option value="Cardiology (Heart)"></option>
                            <option value="Dermatology (Skin)"></option>
                            <option value="Endocrinology (Diabetes & Hormones)"></option>
                            <option value="Gastroenterology (Stomach & Liver)"></option>
                            <option value="General Medicine / Internal Medicine"></option>
                            <option value="Neurology (Brain & Nerves)"></option>
                            <option value="Gynecology & Obstetrics"></option>
                            <option value="Oncology (Cancer)"></option>
                            <option value="Ophthalmology (Eyes)"></option>
                            <option value="Orthopedics (Bones & Joints)"></option>
                            <option value="Pediatrics (Children's Health)"></option>
                            <option value="Psychiatry (Mental Health)"></option>
                            <option value="Pulmonology (Lungs & Breathing)"></option>
                            <option value="Radiology (X-Ray & Scans)"></option>
                            <option value="Urology"></option>
                        </datalist>
                    </div>

                    <!-- Clinic Field -->
                    <div class="form-group">
                        <label><span class="emoji-label">🏥</span> Clinic</label>
                        <input type="text" th:field="*{clinic}" class="form-input"
                               placeholder="Enter Clinic Name" required />
                    </div>

                    <!-- Contact Field -->
                    <div class="form-group">
                        <label><span class="emoji-label">📞</span> Phone Number</label>
                        <input type="text" th:field="*{phoneNumber}" class="form-input"
                               placeholder="Enter Phone Number" required />
                    </div>

                    <!-- Actions Panel Box -->
                    <div class="form-actions">
                        <button type="submit" class="ui-btn">💾 Save Doctor</button>
                        
                        <a th:href="@{/admin/doctor}" class="ui-btn btn-cancel">
                            ↩️ Cancel
                        </a>
                    </div>
                </form>

            </section>

        </main>

    </div>

</body>
</html>
